[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["rls/*"]
dev-mode-dirs = ["."]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
local_scheme = "no-local-version"
fallback_version = "0.6.0"

[project]
name = "rlsalchemy"
dynamic = ["version"]
authors = [
  { name = "Pedro Valois", email = "contact@phvv.me" },
  { name = "DelfinaCare", email = "open-source@delfina.com" },
]
description = "Declarative PostgreSQL and CockroachDB row security for SQLAlchemy and Alembic"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

dependencies = [
  "alembic>=1.18.5,<2",
  "inflection>=0.5.1,<1",
  "patos>=0.0.8,<0.1",
  "pydantic>=2.13.4,<3",
  "sqlalchemy>=2.1.0b3,<3",
  "sqlglot>=30,<31",
]

[dependency-groups]
dev = [
  "build>=1.3,<2",
  "hypothesis>=6.155,<7",
  "mypy>=2.3,<3",
  "pyrefly>=1.1.1,<2",
  "pytest>=9.1,<10",
  "pytest-cov>=7.1,<8",
  "ruff>=0.15,<0.16",
]

[tool.chefe.workspace]
platforms = ["linux-64"]

[tool.chefe.conda]
python = ">=3.14.6,<3.15"

[tool.chefe.python]
prerelease-mode = "allow"

[tool.chefe.sources]
patos = { provider = "path", path = "../patos", editable = true }
sqlalchemy = { provider = "path", path = "../sqlalchemy", editable = true }

[tool.chefe.tasks]
build = "python -m build"
lint = "ruff check rls tests && ruff format --check rls tests"
typecheck = "mypy rls && pyrefly check"
test = "python -m pytest"
check = { run = "true", depends = ["lint", "typecheck", "test", "build"] }

[project.entry-points."alembic.plugins"]
rls = "rls.plugin:plugins"

[project.urls]
Homepage = "https://github.com/phvv-me/rls"
Issues = "https://github.com/phvv-me/rls/issues"

[tool.mypy]
python_version = "3.14"
strict = true
files = ["rls"]

[tool.pyrefly]
project-includes = ["rls", "tests"]
search-path = [".", "tests", "../patos/src"]
python-interpreter-path = "../../.chefe/.pixi/envs/default/bin/python"

[tool.ruff]
line-length = 99

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.pytest.ini_options]
addopts = "-q --cov=rls --cov-branch --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.report]
fail_under = 100
